<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc"><title id="title">Recurrent networks carry state through time</title><desc id="desc">Each step reads the current input and updates a memory state. LSTM and GRU gates regulate what to keep, overwrite, and expose.</desc><rect width="1200" height="410" rx="22" fill="#f7f5f0"/><text x="36" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#18212f">Recurrent networks carry state through time</text><text x="36" y="72" font-family="Arial,sans-serif" font-size="15" fill="#4b5563">Each step reads the current input and updates a memory state.</text><rect x="36" y="130" width="212.8" height="132" rx="13" fill="#e4eefc" stroke="#8c98a8" stroke-width="1.4"/><text x="142.4" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#172033">x₁, h₀</text><text x="142.4" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#303b4b">first step</text><path d="M 251.8 196 H 260.8" stroke="#556579" stroke-width="2.3"/><path d="M 254.8 191 L 261.8 196 L 254.8 201" stroke="#556579" stroke-width="2.3" fill="none"/><rect x="264.8" y="130" width="212.8" height="132" rx="13" fill="#e8f4ef" stroke="#8c98a8" stroke-width="1.4"/><text x="371.20000000000005" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#172033">CELL</text><text x="371.20000000000005" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#303b4b">update h₁</text><path d="M 480.6 196 H 489.6" stroke="#556579" stroke-width="2.3"/><path d="M 483.6 191 L 490.6 196 L 483.6 201" stroke="#556579" stroke-width="2.3" fill="none"/><rect x="493.6" y="130" width="212.8" height="132" rx="13" fill="#fff0d8" stroke="#8c98a8" stroke-width="1.4"/><text x="600" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#172033">x₂, h₁</text><text x="600" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#303b4b">next step</text><path d="M 709.4000000000001 196 H 718.4000000000001" stroke="#556579" stroke-width="2.3"/><path d="M 712.4000000000001 191 L 719.4000000000001 196 L 712.4000000000001 201" stroke="#556579" stroke-width="2.3" fill="none"/><rect x="722.4000000000001" y="130" width="212.8" height="132" rx="13" fill="#eee8fb" stroke="#8c98a8" stroke-width="1.4"/><text x="828.8000000000001" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#172033">CELL</text><text x="828.8000000000001" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#303b4b">update h₂</text><path d="M 938.2 196 H 947.2" stroke="#556579" stroke-width="2.3"/><path d="M 941.2 191 L 948.2 196 L 941.2 201" stroke="#556579" stroke-width="2.3" fill="none"/><rect x="951.2" y="130" width="212.8" height="132" rx="13" fill="#fbe8e7" stroke="#8c98a8" stroke-width="1.4"/><text x="1057.6000000000001" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#172033">ŷ</text><text x="1057.6000000000001" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#303b4b">use final state</text><rect x="36" y="300" width="1128" height="76" rx="12" fill="#18212f"/><text x="58" y="328" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#b9d8ff">KEY IDEA</text><text x="58" y="352" font-family="Arial,sans-serif" font-size="16" fill="#ffffff">LSTM and GRU gates regulate what to keep, overwrite, and expose.</text></svg>