<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc"><title id="title">Three routes to generating data</title><desc id="desc">Different training objectives lead to different ways of sampling new examples. All learn a data distribution, but their objectives, failure modes, and sampling costs differ.</desc><rect width="1200" height="410" rx="22" fill="#f7f5f0"/><text x="36" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#18212f">Three routes to generating data</text><text x="36" y="72" font-family="Arial,sans-serif" font-size="15" fill="#4b5563">Different training objectives lead to different ways of sampling new examples.</text><rect x="36" y="130" width="365.3333333333333" height="132" rx="13" fill="#e4eefc" stroke="#8c98a8" stroke-width="1.4"/><text x="218.66666666666666" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#172033">VAE</text><text x="218.66666666666666" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#303b4b">encode → sample z</text><text x="218.66666666666666" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#303b4b">→ decode</text><path d="M 404.3333333333333 196 H 413.3333333333333" stroke="#556579" stroke-width="2.3"/><path d="M 407.3333333333333 191 L 414.3333333333333 196 L 407.3333333333333 201" stroke="#556579" stroke-width="2.3" fill="none"/><rect x="417.3333333333333" y="130" width="365.3333333333333" height="132" rx="13" fill="#e8f4ef" stroke="#8c98a8" stroke-width="1.4"/><text x="600" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#172033">GAN</text><text x="600" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#303b4b">generator vs.</text><text x="600" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#303b4b">discriminator</text><path d="M 785.6666666666666 196 H 794.6666666666666" stroke="#556579" stroke-width="2.3"/><path d="M 788.6666666666666 191 L 795.6666666666666 196 L 788.6666666666666 201" stroke="#556579" stroke-width="2.3" fill="none"/><rect x="798.6666666666666" y="130" width="365.3333333333333" height="132" rx="13" fill="#fff0d8" stroke="#8c98a8" stroke-width="1.4"/><text x="981.3333333333333" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#172033">DIFFUSION</text><text x="981.3333333333333" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#303b4b">add noise → learn</text><text x="981.3333333333333" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#303b4b">to reverse it</text><rect x="36" y="300" width="1128" height="76" rx="12" fill="#18212f"/><text x="58" y="328" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#b9d8ff">KEY IDEA</text><text x="58" y="352" font-family="Arial,sans-serif" font-size="16" fill="#ffffff">All learn a data distribution, but their objectives, failure modes, and sampling costs differ.</text></svg>