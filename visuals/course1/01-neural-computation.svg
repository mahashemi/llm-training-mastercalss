<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc"><title id="title">From inputs to a learned decision</title><desc id="desc">A neuron combines evidence, then an activation turns it into a response. The weights decide what matters; learning changes them using evidence.</desc><rect width="1200" height="410" rx="22" fill="#f7f5f0"/><text x="36" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#18212f">From inputs to a learned decision</text><text x="36" y="72" font-family="Arial,sans-serif" font-size="15" fill="#4b5563">A neuron combines evidence, then an activation turns it into a response.</text><rect x="36" y="130" width="270" height="132" rx="13" fill="#e4eefc" stroke="#8c98a8" stroke-width="1.4"/><text x="171" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#172033">INPUTS</text><text x="171" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#303b4b">features x</text><path d="M 309 196 H 318" stroke="#556579" stroke-width="2.3" fill="none"/><path d="M 312 191 L 319 196 L 312 201" stroke="#556579" stroke-width="2.3" fill="none"/><rect x="322" y="130" width="270" height="132" rx="13" fill="#e8f4ef" stroke="#8c98a8" stroke-width="1.4"/><text x="457" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#172033">WEIGHTED SUM</text><text x="457" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#303b4b">z = w · x + b</text><path d="M 595 196 H 604" stroke="#556579" stroke-width="2.3" fill="none"/><path d="M 598 191 L 605 196 L 598 201" stroke="#556579" stroke-width="2.3" fill="none"/><rect x="608" y="130" width="270" height="132" rx="13" fill="#fff0d8" stroke="#8c98a8" stroke-width="1.4"/><text x="743" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#172033">ACTIVATION</text><text x="743" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#303b4b">ŷ = φ(z)</text><path d="M 881 196 H 890" stroke="#556579" stroke-width="2.3" fill="none"/><path d="M 884 191 L 891 196 L 884 201" stroke="#556579" stroke-width="2.3" fill="none"/><rect x="894" y="130" width="270" height="132" rx="13" fill="#eee8fb" stroke="#8c98a8" stroke-width="1.4"/><text x="1029" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#172033">LEARNING</text><text x="1029" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#303b4b">adjust w, b</text><rect x="36" y="300" width="1128" height="76" rx="12" fill="#18212f"/><text x="58" y="328" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#b9d8ff">KEY IDEA</text><text x="58" y="352" font-family="Arial,sans-serif" font-size="16" fill="#ffffff">The weights decide what matters; learning changes them using evidence.</text></svg>