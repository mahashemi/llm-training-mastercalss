<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc"><title id="title">A self-organizing map learns neighborhoods</title><desc id="desc">The best-matching unit wins; nearby map units move toward the same example. The neighborhood shrinks during training; topology is a property to measure, not assume.</desc><rect width="1200" height="410" rx="22" fill="#f7f5f0"/><text x="36" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#18212f">A self-organizing map learns neighborhoods</text><text x="36" y="72" font-family="Arial,sans-serif" font-size="15" fill="#4b5563">The best-matching unit wins; nearby map units move toward the same example.</text><rect x="36" y="130" width="270" height="132" rx="13" fill="#e4eefc" stroke="#8c98a8" stroke-width="1.4"/><text x="171" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#172033">EXAMPLE x</text><text x="171" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#303b4b">an input vector</text><path d="M 309 196 H 318" stroke="#556579" stroke-width="2.3" fill="none"/><path d="M 312 191 L 319 196 L 312 201" stroke="#556579" stroke-width="2.3" fill="none"/><rect x="322" y="130" width="270" height="132" rx="13" fill="#e8f4ef" stroke="#8c98a8" stroke-width="1.4"/><text x="457" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#172033">MATCH</text><text x="457" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#303b4b">find nearest code</text><path d="M 595 196 H 604" stroke="#556579" stroke-width="2.3" fill="none"/><path d="M 598 191 L 605 196 L 598 201" stroke="#556579" stroke-width="2.3" fill="none"/><rect x="608" y="130" width="270" height="132" rx="13" fill="#fff0d8" stroke="#8c98a8" stroke-width="1.4"/><text x="743" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#172033">WINNER BMU</text><text x="743" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#303b4b">smallest distance</text><path d="M 881 196 H 890" stroke="#556579" stroke-width="2.3" fill="none"/><path d="M 884 191 L 891 196 L 884 201" stroke="#556579" stroke-width="2.3" fill="none"/><rect x="894" y="130" width="270" height="132" rx="13" fill="#eee8fb" stroke="#8c98a8" stroke-width="1.4"/><text x="1029" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#172033">NEIGHBORS</text><text x="1029" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#303b4b">move toward x</text><rect x="36" y="300" width="1128" height="76" rx="12" fill="#18212f"/><text x="58" y="328" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#b9d8ff">KEY IDEA</text><text x="58" y="352" font-family="Arial,sans-serif" font-size="16" fill="#ffffff">The neighborhood shrinks during training; topology is a property to measure, not assume.</text></svg>