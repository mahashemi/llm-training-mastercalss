<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"><rect width="1200" height="360" rx="20" fill="#f7f5f0"/><text x="40" y="48" font-family="Arial" font-size="26" font-weight="bold" fill="#18212f">An RBM learns by contrasting distributions</text><text x="40" y="78" font-family="Arial" font-size="16" fill="#4b5563">Visible and hidden units interact; learning contrasts data with model-generated samples.</text><rect x="50" y="135" width="200" height="100" rx="12" fill="#e4eefc" stroke="#8c98a8"/><text x="150" y="178" text-anchor="middle" font-family="Arial" font-size="18" fill="#172033">DATA v</text><text x="150" y="204" text-anchor="middle" font-family="Arial" font-size="15" fill="#303b4b">observed patterns</text><path d="M250 185 H282 l-8 -6 m8 6 l-8 6" stroke="#556579" stroke-width="2.5" fill="none"/><rect x="285" y="135" width="200" height="100" rx="12" fill="#e8f4ef" stroke="#8c98a8"/><text x="385" y="178" text-anchor="middle" font-family="Arial" font-size="18" fill="#172033">HIDDEN h</text><text x="385" y="204" text-anchor="middle" font-family="Arial" font-size="15" fill="#303b4b">latent causes</text><path d="M485 185 H517 l-8 -6 m8 6 l-8 6" stroke="#556579" stroke-width="2.5" fill="none"/><rect x="520" y="135" width="200" height="100" rx="12" fill="#fff0d8" stroke="#8c98a8"/><text x="620" y="178" text-anchor="middle" font-family="Arial" font-size="18" fill="#172033">ENERGY E(v,h)</text><text x="620" y="204" text-anchor="middle" font-family="Arial" font-size="15" fill="#303b4b">compatibility</text><path d="M720 185 H752 l-8 -6 m8 6 l-8 6" stroke="#556579" stroke-width="2.5" fill="none"/><rect x="755" y="135" width="200" height="100" rx="12" fill="#eee8fb" stroke="#8c98a8"/><text x="855" y="178" text-anchor="middle" font-family="Arial" font-size="18" fill="#172033">MODEL SAMPLES</text><text x="855" y="204" text-anchor="middle" font-family="Arial" font-size="15" fill="#303b4b">Gibbs transitions</text><path d="M955 185 H987 l-8 -6 m8 6 l-8 6" stroke="#556579" stroke-width="2.5" fill="none"/><rect x="990" y="135" width="160" height="100" rx="12" fill="#fbe8e7" stroke="#8c98a8"/><text x="1070" y="178" text-anchor="middle" font-family="Arial" font-size="18" fill="#172033">UPDATE</text><text x="1070" y="204" text-anchor="middle" font-family="Arial" font-size="15" fill="#303b4b">positive − negative</text><rect x="40" y="275" width="1120" height="52" rx="10" fill="#18212f"/><text x="60" y="307" font-family="Arial" font-size="17" fill="white">Contrastive divergence approximates a difficult distribution-learning update.</text></svg>