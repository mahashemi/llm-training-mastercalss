<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"><rect width="1200" height="360" rx="20" fill="#f7f5f0"/><text x="40" y="48" font-family="Arial" font-size="26" font-weight="bold" fill="#18212f">The reinforcement-learning feedback loop</text><rect x="60" y="135" width="202" height="105" rx="12" fill="#e4eefc" stroke="#8c98a8"/><text x="161" y="193" font-family="Arial" font-size="16" text-anchor="middle" fill="#172033">AGENT</text><rect x="276" y="135" width="202" height="105" rx="12" fill="#e8f4ef" stroke="#8c98a8"/><text x="377" y="193" font-family="Arial" font-size="16" text-anchor="middle" fill="#172033">ACTION</text><rect x="492" y="135" width="202" height="105" rx="12" fill="#fff0d8" stroke="#8c98a8"/><text x="593" y="193" font-family="Arial" font-size="16" text-anchor="middle" fill="#172033">ENVIRONMENT</text><rect x="708" y="135" width="202" height="105" rx="12" fill="#eee8fb" stroke="#8c98a8"/><text x="809" y="193" font-family="Arial" font-size="16" text-anchor="middle" fill="#172033">REWARD</text><rect x="924" y="135" width="202" height="105" rx="12" fill="#fbe8e7" stroke="#8c98a8"/><text x="1025" y="193" font-family="Arial" font-size="16" text-anchor="middle" fill="#172033">UPDATE</text><rect x="40" y="275" width="1120" height="52" rx="10" fill="#18212f"/><text x="60" y="307" font-family="Arial" font-size="17" fill="white">Evaluate across multiple seeds and held-out episodes; one lucky trajectory is not evidence.</text></svg>