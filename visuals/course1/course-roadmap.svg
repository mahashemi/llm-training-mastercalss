<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Course 1: from learning mechanisms to research evidence</title><desc id="desc">A five-stage roadmap across 35 teaching days, with a midterm on day 18 and final exam on day 35.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101b35"/><stop offset="1" stop-color="#202e4b"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><rect width="1200" height="760" rx="34" fill="url(#bg)"/><text x="64" y="78" font-family="Arial,sans-serif" font-size="19" fill="#93c5fd" letter-spacing="3">COURSE 1 · 35 TEACHING DAYS</text><text x="64" y="132" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#fff">From learning mechanisms to research evidence</text><text x="64" y="169" font-family="Arial,sans-serif" font-size="19" fill="#cbd5e1">You start your research in Week 1—not at the end of the course.</text><path d="M105 292 H1095" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/><g font-family="Arial,sans-serif"><circle cx="130" cy="292" r="24" fill="#60a5fa" stroke="#dbeafe" stroke-width="4"/><circle cx="365" cy="292" r="24" fill="#38bdf8" stroke="#e0f2fe" stroke-width="4"/><circle cx="600" cy="292" r="24" fill="#a78bfa" stroke="#ede9fe" stroke-width="4"/><circle cx="835" cy="292" r="24" fill="#f59e0b" stroke="#fef3c7" stroke-width="4"/><circle cx="1070" cy="292" r="24" fill="#34d399" stroke="#d1fae5" stroke-width="4"/><g fill="#f8fafc" font-size="20" font-weight="700"><text x="70" y="237">01 · GET STARTED</text><text x="315" y="237">02 · BUILD</text><text x="542" y="237">03 · MIDTERM</text><text x="768" y="237">04 · INVESTIGATE</text><text x="1002" y="237">05 · COMMUNICATE</text></g><g fill="#cbd5e1" font-size="17"><text x="80" y="344">Days 1–7</text><text x="315" y="344">Days 8–17</text><text x="542" y="344">Day 18</text><text x="768" y="344">Days 19–32</text><text x="1002" y="344">Days 33–35</text></g><g fill="#dbeafe" font-size="16"><text x="80" y="387">Question + proposal</text><text x="80" y="413">Study report begins</text><text x="315" y="387">SOM, CNN, latent</text><text x="315" y="413">representations</text><text x="542" y="387">Individual exam</text><text x="542" y="413">Foundations to Day 14</text><text x="768" y="387">Models, baseline,</text><text x="768" y="413">controlled experiment</text><text x="1002" y="387">Talk + submission</text><text x="1002" y="413">Final examination</text></g></g><rect x="64" y="488" width="1072" height="190" rx="22" fill="#fff" opacity=".07" stroke="#94a3b8" stroke-opacity=".35"/><text x="94" y="533" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Your project grows in parallel with the lectures</text><g font-family="Arial,sans-serif" font-size="17" fill="#e2e8f0"><text x="94" y="578">Day 3 · Choose a question</text><text x="380" y="578">Day 7 · Proposal</text><text x="610" y="578">Day 29 · Baseline</text><text x="840" y="578">Day 32 · Evidence</text><text x="94" y="625">Day 30 · Study-report draft</text><text x="380" y="625">Day 31 · Intervention</text><text x="610" y="625">Day 33 · Presentation</text><text x="840" y="625">Day 34 · Final package</text></g></svg>