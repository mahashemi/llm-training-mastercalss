<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">From class project to responsible public research</title><desc id="desc">A staged pathway from question and proposal through baseline, controlled experiment, reproducible report, instructor review, and optional public preprint or venue submission.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#24334d"/></linearGradient></defs><rect width="1200" height="700" rx="30" fill="url(#bg)"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="18" letter-spacing="3" fill="#a5b4fc">RESEARCH IS A PROCESS</text><text x="60" y="122" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#fff">From curiosity to a credible public artifact</text><text x="60" y="158" font-family="Arial,sans-serif" font-size="18" fill="#cbd5e1">The goal is reproducible evidence—not a publication promise.</text><g font-family="Arial,sans-serif"><rect x="60" y="215" width="320" height="106" rx="18" fill="#1d4ed8"/><text x="84" y="253" font-size="17" fill="#bfdbfe">STEP 01</text><text x="84" y="285" font-size="23" font-weight="700" fill="#fff">Question + hypothesis</text><text x="84" y="309" font-size="15" fill="#dbeafe">Days 1–7</text><rect x="440" y="215" width="320" height="106" rx="18" fill="#0369a1"/><text x="464" y="253" font-size="17" fill="#bae6fd">STEP 02</text><text x="464" y="285" font-size="23" font-weight="700" fill="#fff">Baseline + controls</text><text x="464" y="309" font-size="15" fill="#e0f2fe">Before the main experiment</text><rect x="820" y="215" width="320" height="106" rx="18" fill="#0f766e"/><text x="844" y="253" font-size="17" fill="#99f6e4">STEP 03</text><text x="844" y="285" font-size="23" font-weight="700" fill="#fff">Experiment + analysis</text><text x="844" y="309" font-size="15" fill="#ccfbf1">Days 29–32</text><path d="M380 268 H432 M760 268 H812" stroke="#cbd5e1" stroke-width="3"/><path d="M423 259 L433 268 L423 277 M803 259 L813 268 L803 277" fill="none" stroke="#cbd5e1" stroke-width="3"/><rect x="820" y="390" width="320" height="106" rx="18" fill="#7c3aed"/><text x="844" y="428" font-size="17" fill="#ddd6fe">STEP 04</text><text x="844" y="460" font-size="23" font-weight="700" fill="#fff">Paper + artifacts</text><text x="844" y="484" font-size="15" fill="#ede9fe">Methods, figures, code, limits</text><rect x="440" y="390" width="320" height="106" rx="18" fill="#a16207"/><text x="464" y="428" font-size="17" fill="#fef08a">STEP 05</text><text x="464" y="460" font-size="23" font-weight="700" fill="#fff">Instructor + peer review</text><text x="464" y="484" font-size="15" fill="#fef3c7">Authorship, ethics, venue fit</text><rect x="60" y="390" width="320" height="106" rx="18" fill="#334155" stroke="#94a3b8"/><text x="84" y="428" font-size="17" fill="#cbd5e1">STEP 06 · OPTIONAL</text><text x="84" y="460" font-size="23" font-weight="700" fill="#fff">Preprint / submission</text><text x="84" y="484" font-size="15" fill="#e2e8f0">Only when work is ready</text><path d="M980 321 V382 M820 443 H768 M440 443 H388" stroke="#cbd5e1" stroke-width="3"/><path d="M971 373 L980 383 L989 373 M777 434 L767 443 L777 452 M397 434 L387 443 L397 452" fill="none" stroke="#cbd5e1" stroke-width="3"/><rect x="60" y="550" width="1080" height="92" rx="17" fill="#fff" opacity=".08" stroke="#94a3b8" stroke-opacity=".5"/><text x="84" y="586" font-size="18" font-weight="700" fill="#fff">Responsible research rule</text><text x="84" y="615" font-size="17" fill="#e2e8f0">Never invent results or authorship. Verify licenses, consent, contributions, advisor approval, and venue rules.</text></g></svg>