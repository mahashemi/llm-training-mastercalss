<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Course 1 assessment breakdown</title><desc id="desc">Assignments and project work 40 percent, critical study report 15 percent, midterm exam 15 percent, final exam 30 percent.</desc><rect width="1200" height="620" rx="30" fill="#f8fafc"/><text x="62" y="72" font-family="Arial,sans-serif" font-size="19" letter-spacing="3" fill="#475569">ASSESSMENT · 100% TOTAL</text><text x="62" y="122" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#0f172a">Four ways to show what you can do</text><text x="62" y="159" font-family="Arial,sans-serif" font-size="19" fill="#475569">Effort is distributed across the course; research is not a two-day afterthought.</text><g font-family="Arial,sans-serif"><rect x="62" y="211" width="1076" height="72" rx="15" fill="#dbeafe"/><rect x="62" y="211" width="430" height="72" rx="15" fill="#2563eb"/><text x="88" y="255" font-size="23" font-weight="700" fill="#fff">40%</text><text x="520" y="255" font-size="23" font-weight="700" fill="#1e293b">Assignments + project work</text><text x="88" y="306" font-size="16" fill="#475569">Day 1 assignments → Day 7 proposal → Day 34 reproducible project</text><rect x="62" y="342" width="1076" height="55" rx="13" fill="#e2e8f0"/><rect x="62" y="342" width="161" height="55" rx="13" fill="#0d9488"/><text x="86" y="377" font-size="21" font-weight="700" fill="#fff">15%</text><text x="250" y="377" font-size="21" font-weight="700" fill="#0f172a">Critical study report</text><text x="855" y="377" font-size="16" fill="#475569">Topic Day 5 · Due Day 34</text><rect x="62" y="420" width="1076" height="55" rx="13" fill="#e2e8f0"/><rect x="62" y="420" width="161" height="55" rx="13" fill="#d97706"/><text x="86" y="455" font-size="21" font-weight="700" fill="#fff">15%</text><text x="250" y="455" font-size="21" font-weight="700" fill="#0f172a">Midterm examination</text><text x="855" y="455" font-size="16" fill="#475569">Day 18 · Individual</text><rect x="62" y="498" width="1076" height="55" rx="13" fill="#e2e8f0"/><rect x="62" y="498" width="323" height="55" rx="13" fill="#7c3aed"/><text x="86" y="533" font-size="21" font-weight="700" fill="#fff">30%</text><text x="410" y="533" font-size="21" font-weight="700" fill="#0f172a">Final examination</text><text x="855" y="533" font-size="16" fill="#475569">Day 35 · Individual</text></g></svg>