name: Course 1 notebook structural validation

on:
  push:
    branches: [main]
    paths:
      - "lectures/00_neural_computing/**"
      - ".github/workflows/course1-notebook-validation.yml"
  pull_request:
    paths:
      - "lectures/00_neural_computing/**"
      - ".github/workflows/course1-notebook-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install notebook validator
        run: python -m pip install --upgrade nbformat
      - name: Validate notebook structure and Python syntax
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          import nbformat

          root = Path("lectures/00_neural_computing")
          notebooks = sorted(root.glob("*/lab.ipynb"))
          assert len(notebooks) == 12, f"Expected 12 labs, found {len(notebooks)}"

          failures = []
          for path in notebooks:
              try:
                  nb = nbformat.read(path, as_version=4)
                  nbformat.validate(nb)
                  code_cells = [c.source for c in nb.cells if c.cell_type == "code"]
                  if not any("matplotlib" in line and line.startswith("!pip") for cell in code_cells for line in cell.splitlines()):
                      raise AssertionError("Lab must declare matplotlib in its pip install cell")
                  if not any(any(token in cell for token in ("plt.", "ax.", "subplots(", "imshow(")) for cell in code_cells):
                      raise AssertionError("Lab has no plotting code")
                  for index, source in enumerate(code_cells):
                      # Notebook shell/magic commands are IPython syntax, not Python syntax.
                      cleaned = "\n".join(
                          line for line in source.splitlines()
                          if not line.lstrip().startswith(("!", "%"))
                      )
                      if cleaned.strip():
                          try:
                              ast.parse(cleaned)
                          except SyntaxError as exc:
                              raise AssertionError(f"code cell {index}: {exc}") from exc
              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              raise SystemExit("\n".join(failures))
          print(f"PASS: structurally validated {len(notebooks)} Course 1 notebooks.")
          print("Note: this checks notebook structure and Python syntax; it does not execute training or download datasets.")
          PY
