name: Course 1 full notebook execution

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/course1-notebook-execution.yml"
      - "lectures/00_neural_computing/**/lab.ipynb"

permissions:
  contents: read

jobs:
  execute-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        notebook:
          - lectures/00_neural_computing/01_neural_computing_foundations/lab.ipynb
          - lectures/00_neural_computing/02_feedforward_and_backprop/lab.ipynb
          - lectures/00_neural_computing/03_competitive_learning_and_som/lab.ipynb
          - lectures/00_neural_computing/04_convolutional_networks/lab.ipynb
          - lectures/00_neural_computing/05_autoencoders/lab.ipynb
          - lectures/00_neural_computing/06_generative_models/lab.ipynb
          - lectures/00_neural_computing/07_recurrent_networks/lab.ipynb
          - lectures/00_neural_computing/08_sequence_architectures_and_forecasting/lab.ipynb
          - lectures/00_neural_computing/09_boltzmann_machines/lab.ipynb
          - lectures/00_neural_computing/10_attention_transformers_and_llms/lab.ipynb
          - lectures/00_neural_computing/11_deep_reinforcement_learning/lab.ipynb
          - lectures/00_neural_computing/12_research_capstone/lab.ipynb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Jupyter execution tools
        run: python -m pip install --upgrade nbconvert ipykernel
      - name: Execute notebook from a clean kernel
        env:
          NOTEBOOK: ${{ matrix.notebook }}
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --ExecutePreprocessor.timeout=1800 \
            --output executed.ipynb \
            --output-dir "$RUNNER_TEMP" \
            "$NOTEBOOK"
