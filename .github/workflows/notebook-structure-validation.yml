name: Notebook structure and syntax checks

on:
  pull_request:
    branches: [main]
    paths:
      - "lectures/**/lab.ipynb"
      - ".github/workflows/notebook-structure-validation.yml"
  push:
    branches: [main]
    paths:
      - "lectures/**/lab.ipynb"
      - ".github/workflows/notebook-structure-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install notebook validation tools
        run: python -m pip install --upgrade nbformat ipython
      - name: Validate notebook structure and Python syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import nbformat
          from IPython.core.interactiveshell import InteractiveShell

          shell = InteractiveShell()
          notebooks = sorted(Path("lectures").rglob("lab.ipynb"))
          if not notebooks:
              raise SystemExit("No lecture lab notebooks were found.")

          failures = []
          for path in notebooks:
              try:
                  notebook = nbformat.read(path, as_version=4)
                  nbformat.validate(notebook)
                  for index, cell in enumerate(notebook.cells):
                      if cell.cell_type != "code" or not cell.source.strip():
                          continue
                      transformed = shell.transform_cell(cell.source)
                      compile(transformed, f"{path}:cell-{index}", "exec")
                  print(f"PASS {path} ({len(notebook.cells)} cells)")
              except Exception as exc:
                  failures.append((str(path), str(exc)))
                  print(f"FAIL {path}: {type(exc).__name__}: {exc}")

          if failures:
              print(f"\\n{len(failures)} notebook(s) failed validation.")
              sys.exit(1)
          print(f"\\nValidated {len(notebooks)} notebooks: JSON schema and code-cell syntax.")
          PY
